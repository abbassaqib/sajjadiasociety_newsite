<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#17203A" />
    <title>You're offline | Sajjadia Islamic Society</title>
    <!-- Self-contained on purpose: it has to work with no connection at all -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --card: #ffffff;
        --text: #17203a;
        --muted: #4b5262;
        --border: #e3e3df;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1d;
          --card: #121a2e;
          --text: #eef0f5;
          --muted: #b3b8c4;
          --border: #273049;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.5rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--card);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 1rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      button {
        min-height: 3rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #17203a;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #eef0f5;
          color: #17203a;
        }
      }
      button:focus-visible {
        outline: 3px solid #c9973a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/apple-touch-icon.png" alt="" />
      <h1>You're offline</h1>
      <p>
        This page needs an internet connection. Pages you've opened recently are still available. Reconnect and
        try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
